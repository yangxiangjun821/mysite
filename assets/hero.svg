<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" role="img" aria-labelledby="title desc"><title id="title">The building blocks of a web page</title><desc id="desc">HTML structure, CSS style and JavaScript interaction connect to form a browser page.</desc><rect width="900" height="640" rx="24" fill="#e8e5ee"/><rect x="70" y="65" width="760" height="510" rx="14" fill="#f5e9e8" stroke="#57243f" stroke-width="3"/><path d="M70 120H830" stroke="#57243f" stroke-width="3"/><g fill="#57243f"><circle cx="100" cy="92" r="6"/><circle cx="123" cy="92" r="6"/><circle cx="146" cy="92" r="6"/></g><text x="115" y="210" font-family="Arial,sans-serif" font-size="45" font-weight="bold" fill="#57243f">Make something work.</text><path d="M115 242H680" stroke="#f4c65d" stroke-width="12"/><g font-family="Arial,sans-serif" fill="#57243f"><text x="115" y="317" font-size="24">Three languages. One connected idea.</text><path d="M225 400H675" stroke="#57243f" stroke-width="3"/><g fill="#f4c65d" stroke="#57243f" stroke-width="2"><rect x="115" y="360" width="190" height="90" rx="8"/><rect x="355" y="360" width="190" height="90" rx="8"/><rect x="595" y="360" width="190" height="90" rx="8"/></g><g text-anchor="middle" font-size="27" font-weight="bold"><text x="210" y="414">HTML</text><text x="450" y="414">CSS</text><text x="690" y="414">JavaScript</text></g><g text-anchor="middle" font-size="23"><text x="210" y="499">Structure</text><text x="450" y="499">Style</text><text x="690" y="499">Interaction</text></g></g></svg>